name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags are needed to find the base version and
          # inspect every commit in <base>..HEAD.
          fetch-depth: 0
          fetch-tags: true

      - id: next
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.next.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run or a race with an existing tag must not fail the job.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to do." >&2
            exit 0
          fi
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
